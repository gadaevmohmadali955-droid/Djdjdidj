name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Prepare Keystore & Environment
        run: |
          echo "Setting up debug signing keystore..."
          # 1. Attempt to restore debug.keystore from base64 if available
          if [ -f debug.keystore.base64 ] && [ -s debug.keystore.base64 ]; then
            echo "Found debug.keystore.base64, decoding..."
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore 2>/dev/null || \
            tr -d '\r\n ' < debug.keystore.base64 | base64 --decode > debug.keystore 2>/dev/null || true
          fi

          # 2. If debug.keystore is still missing or empty, generate one immediately with keytool
          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            echo "Generating new debug.keystore for CI build..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo "Keystore verified:"
          ls -la debug.keystore

          # 3. Ensure .env exists so secrets plugin does not fail
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BloxChat-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
